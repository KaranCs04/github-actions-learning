name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4                             # ??? #1 - you know this!
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps       # ??? #2 - critical flag!
      
      - name: Run Playwright tests
        run:  npx playwright test                              # ??? #3 - the test command
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()                               # ??? #4 - when to upload?
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
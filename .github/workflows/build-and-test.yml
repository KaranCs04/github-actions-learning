name: Build and Test with Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install
        run: npm ci
      
      - name: Compile TypeScript
        run: npx tsc                            # creates dist/ folder
      
      - name: Upload build output
        uses: actions/upload-artifact@v4                               # ??? #1 - the upload action
        with:
          name: build-output
          path: dist/
          retention-days: 7
  
  test-unit:
    runs-on: ubuntu-latest
    needs: build                                   # ??? #2 - wait for build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install
        run: npm ci
      
      - name: Download build output
        uses: actions/download-artifact@v4                             # ??? #3 - the download action
        with:
          name: build-output
          path: dist/
      
      - name: Run unit tests
        run: npm test
  
  deploy:
    runs-on: ubuntu-latest
    needs: [build,test-unit]                                # ??? #4 - depend on BOTH jobs (array!)
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
      
      - name: List downloaded files
        run: ls -la dist/
      
      - name: Fake deploy
        if: github.ref == 'refs/heads/main'                               # ??? #5 - only on main branch push
        run: echo "🚀 Deploying to production!"
name:  Secrets Demo

on:
    workflow_dispatch:

jobs:
    show-env:
        runs-on:  ubuntu-latest
        steps:
            -  name:  Show the variable (safe to log)
               run:  echo "Running in environment: ${{vars.APP_ENV}}"

            -  name: Show the secret (will be masked)
               run:  echo "My API key is ${{secrets.API_KEY}}"
      
            -  name: Use secrets in a fake API call
               env:
                    MY_KEY:APP_ENV
                run:
                    echo "Calling API with key length: ${#MY_KEY}"
                    echo "First 3 chars would be hidden: ${MY_KEY:0:3}"